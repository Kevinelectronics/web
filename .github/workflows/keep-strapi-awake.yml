name: Keep Strapi CMS awake

# Render's free plan spins the CMS down after ~15 minutes of inactivity, and
# the next request pays a 30-60s+ cold-start penalty. The /articles page has
# no loading state, so that cold start reads to visitors as "the page
# doesn't respond." Ping a lightweight endpoint often enough that Render
# never sees 15 minutes of idle time.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping CMS
        run: curl -sfg -o /dev/null "https://kevin-personal-website-cms.onrender.com/api/articles?pagination[limit]=1" || true
